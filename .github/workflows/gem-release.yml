name: Release gem

on:
  workflow_call:
    inputs:
      ruby-version:
        description: The Ruby the release runs on.
        type: string
        default: "ruby"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    outputs:
      name: ${{ steps.preflight.outputs.name }}
      version: ${{ steps.preflight.outputs.version }}

    steps:
      - name: Check out the gem
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check out the release scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-scripts
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby-version }}
          bundler-cache: true

      - name: Decide whether there is a release to make
        id: preflight
        run: |
          set +e
          .release-scripts/bin/gem-preflight.sh 2>&1 | tee "$RUNNER_TEMP/preflight.log"
          status=${PIPESTATUS[0]}
          set -e

          {
            echo '```'
            cat "$RUNNER_TEMP/preflight.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" = "3" ]; then
            exit 0
          fi
          exit "$status"

      - name: Configure the rubygems.org credential
        if: steps.preflight.outputs.release == 'true'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to rubygems.org
        if: steps.preflight.outputs.release == 'true'
        env:
          GEM: ${{ steps.preflight.outputs.name }}
          VERSION: ${{ steps.preflight.outputs.version }}
        run: |
          git config user.name "$(git log -1 --pretty=format:'%an')"
          git config user.email "$(git log -1 --pretty=format:'%ae')"

          set +e
          .release-scripts/bin/gem-publish.sh "$GEM" "$VERSION" 2>&1 \
            | tee "$RUNNER_TEMP/publish.log"
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"

      - name: Keep what the release printed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-log
          path: ${{ runner.temp }}/*.log
          if-no-files-found: ignore

  notify:
    needs: release
    if: failure()
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Check out the release scripts
        uses: actions/checkout@v6
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-scripts
          persist-credentials: false

      - name: Fetch what the release printed
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: release-log
          path: ${{ runner.temp }}/release-log

      - name: Open an issue naming what failed
        env:
          GH_TOKEN: ${{ github.token }}
          GEM: ${{ needs.release.outputs.name }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          printed=$(cat "$RUNNER_TEMP"/release-log/*.log 2>/dev/null)

          {
            echo '```'
            if [ -n "$printed" ]; then
              printf '%s\n' "$printed" | tail -n 200
            else
              echo "The release stopped before it printed anything."
            fi
            echo '```'
          } > "$RUNNER_TEMP/details.md"

          .release-scripts/bin/gem-release-issue.sh \
            "${GEM:-$(basename "$GITHUB_REPOSITORY")}" \
            "${VERSION:-unknown}" \
            < "$RUNNER_TEMP/details.md"
